name: Deploy Cloudflare-hosted backend

# Manual only: this pushes the Container image and deploys the Worker to a
# real Cloudflare account (packages/cloudflare/cloudflare-worker). Building
# the Container image needs a Linux Docker daemon — a GitHub-hosted runner
# gives one directly, sidestepping the macOS/Colima virtualization issue that
# blocks this build on Apple Silicon dev hosts (see the package README's
# Known Limitations).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: wrangler deploy (Worker + Container)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      # A manually dispatched deploy must fail loud on a missing credential,
      # not silently deploy nothing useful.
      - name: Preflight (require a Cloudflare API token)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Configure the repository secret (needs Workers Scripts Edit + Containers Edit + Account Settings Read)."
            exit 1
          fi

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # Dockerfile.cloudflare's COPY step packages the already-built lib/dist
      # output (this repo's pre-release stance: run what ships, not a second
      # build inside the image) — so the workspace build must run before
      # wrangler deploy triggers the Docker build.
      - name: Build workspace
        run: pnpm run build

      # --containers-rollout=immediate: the default gradual rollout leaves a
      # recently-connected instance on its old image until it passes a grace
      # period (confirmed live — every prior deploy here left the one existing
      # instance serving pre-fix code until manually deleted). A single-DO
      # deployment has nothing to stage a gradual rollout across; immediate
      # replacement is the correct behavior, not a risk being traded away.
      - name: Deploy (Worker + Container)
        working-directory: packages/cloudflare/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --containers-rollout=immediate
