# The dsh-cloudflare-app bundle patch: applied AFTER dsh-web-app's own patch
# (profile bundle order: dsh-base -> dsh-web-app -> dsh-cloudflare-app), so
# this layer keeps the entire browser UI, workspace controller, and session
# controller dsh-web-app already assembles, and only swaps the local-file
# storage/session/credentials backends for their Cloudflare D1 equivalents
# plus disables the local-machine browser handoff. A patch replaces the
# targeted row's whole `config`, so each row below restates every key it owns.

# ── disable the local-file backends dsh-base mounts by default ──────────────

- id: session-persistence-jsonl
  disabled: true

- id: storage-json
  disabled: true

- id: credentials
  disabled: true

# ── route the schema-validated domain form at the D1 backend ────────────────

- id: storage-domain
  config:
    backend: d1

# ── Cloudflare D1 backends, credentials sourced from the container's own
#    environment (set by the host-container Durable Object, never committed) ─

- insert:
    - id: storage-d1
      name: '@deepseek-ai/dsh-storage-d1'
      config:
        accountId: !!js process.env.CLOUDFLARE_ACCOUNT_ID
        databaseId: !!js process.env.CLOUDFLARE_D1_DATABASE_ID
        apiToken: !!js process.env.CLOUDFLARE_D1_API_TOKEN

    - id: session-persistence-d1
      name: '@deepseek-ai/dsh-session-persistence-d1'
      config:
        accountId: !!js process.env.CLOUDFLARE_ACCOUNT_ID
        databaseId: !!js process.env.CLOUDFLARE_D1_DATABASE_ID
        apiToken: !!js process.env.CLOUDFLARE_D1_API_TOKEN

    - id: credentials-d1
      name: '@deepseek-ai/dsh-credentials-d1'
      config:
        accountId: !!js process.env.CLOUDFLARE_ACCOUNT_ID
        databaseId: !!js process.env.CLOUDFLARE_D1_DATABASE_ID
        apiToken: !!js process.env.CLOUDFLARE_D1_API_TOKEN

    # Fails loud at boot when a required Cloudflare credential is missing,
    # instead of surfacing as an opaque D1 REST failure on first storage use.
    - id: cloudflare-app-startup
      name: '@deepseek-ai/dsh-cloudflare-app'

# ── no local browser or LAN handoff inside a container ───────────────────────
#
# trustedHosts names this deployment's own public hostname: the container
# binds all interfaces, so requests arrive with that hostname in Host, not
# loopback, and dsh-client-connection's Host/Origin trust fence (fed from
# this value via ctx.webRuntime.trustedHosts) refuses every other Host.

- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js '[process.env.CLOUDFLARE_WORKER_HOSTNAME]'

# ── bind every interface: dsh-web-app's own patch resolves this row's host
#    from the invocation's --host flag, but dsh-web-app's startup CLI guard
#    (packages/bundle/web-app/src/startup.ts) rejects --host 0.0.0.0 outright
#    as a local-machine safety measure (it would expose remote code execution
#    to a LAN). That guard's premise does not hold here: this row runs inside
#    Cloudflare's own network-isolated Container, reachable only through
#    Cloudflare's internal proxy, which — confirmed against a real deployment —
#    connects on an address this process has no way to discover or bind
#    individually. Restating host directly bypasses the --host flag path (and
#    its guard) rather than weakening it for the shared dsh-web-app surface.
- id: webserver
  inject: [webStartup]
  config:
    host: '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 8080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# ── trust Cloudflare Access as the sole authentication boundary ─────────────
#
# dsh-client-connection's own browser-session gate (a random per-process
# launch token, normally satisfied by opening the URL dsh web prints) can
# never be satisfied here: this profile disables both printing and opening
# that URL (web-runtime's config above), so the token has no way to reach a
# caller. Cloudflare Access already verifies a signed JWT on every request
# before it reaches this container (edge-gateway's 401 on a missing
# Cf-Access-Jwt-Assertion header) — requiring this second, unsatisfiable gate
# on top of Access would make the deployment permanently inaccessible, not
# more secure.
#
# trustedAsHost: false is a safety gate against an untrusted LAN caller
# reaching this non-loopback origin and writing credentials through the
# browser Models Settings UI (packages/client/ui-settings's
# SettingsDescribeMirror falls back to memory-only for any non-loopback
# origin by default). That premise does not hold here for the same reason
# requireBrowserSession above does not: Cloudflare Access authenticates
# every caller before this container ever sees a request, so the origin
# being non-loopback no longer implies an untrusted caller.
- id: connection
  inject: [webRuntime]
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
    requireBrowserSession: false
    trustedAsHost: true

# ── default model: Claude Haiku via the pi-ai anthropic route ───────────────
#
# llm-pi-ai ships mounted dormant (zero provider routes) until something
# supplies a `providers` profile; the base bundle relies on the Models
# Settings page writing one to $DSH_HOME/settings.yaml, which this deployment
# cannot use for a durable default (the container's own disk is ephemeral —
# see Dockerfile.cloudflare). Declaring the route directly in composition
# works independently of any settings document or of whether the Settings UI
# is reachable at all.

- id: llm-pi-ai
  config:
    providers:
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
        models:
          - id: claude-haiku-4-5-20251001
            name: Claude Haiku 4.5

- id: agent-default-model
  config:
    provider: anthropic
    model: claude-haiku-4-5-20251001
